name: Saraplay Backend Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}

          script: |
            set -e

            cd /var/www/SARAPLAY-BACKEND

            echo "Pull latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Building Docker image..."
            docker build -t saraplay-backend:latest .

            echo "Stopping old backend..."
            docker stop saraplay-backend || true
            docker rm -f saraplay-backend || true

            echo "Starting backend..."

            docker run -d \
              --restart always \
              --name saraplay-backend \
              --network saraplay-network \
              --env-file /var/www/SARAPLAY-BACKEND/.env.production \
              -v /var/www/SARAPLAY-BACKEND/firebase.json:/app/firebase.json:ro \
              -p 3003:3003 \
              saraplay-backend:latest

            echo "Checking backend..."
            sleep 5
            docker ps --filter "name=saraplay-backend"

            echo "Backend logs..."
            docker logs saraplay-backend --tail 50

            docker image prune -f