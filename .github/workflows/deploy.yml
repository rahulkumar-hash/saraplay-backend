name: Saraplay Backend Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/rahulkumar-hash/saraplay-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/rahulkumar-hash/saraplay-backend:latest
            docker stop saraplay-backend || true
            docker rm -f saraplay-backend || true
            docker run -d \
              --restart always \
              --name saraplay-backend \
              --network saraplay-network \
              --env-file /etc/saraplay/.env.production \
              -v /etc/saraplay/firebase.json:/app/firebase.json:ro \
              -p 3003:3003 \
              ghcr.io/rahulkumar-hash/saraplay-backend:latest
            sleep 5
            docker ps --filter "name=saraplay-backend"
            docker logs saraplay-backend --tail 20
            docker image prune -f
            echo "Backend deployed!"